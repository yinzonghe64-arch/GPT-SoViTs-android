
name: Build OpenJTalk Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4

      - name: Checkout OpenJTalk Native
        uses: actions/checkout@v4
        with:
          repository: ayutaz/openjtalk-native
          path: openjtalk-native

      - name: Build Android Docker image
        run: |
          docker build \
            -f openjtalk-native/docker/Dockerfile.android \
            -t openjtalk-android \
            openjtalk-native

      - name: Compile OpenJTalk for arm64-v8a
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/openjtalk/arm64-v8a"

          docker run --rm \
            -v "$GITHUB_WORKSPACE/openjtalk-native:/workspace" \
            -v "$GITHUB_WORKSPACE/build/openjtalk/arm64-v8a:/output" \
            -w /workspace \
            -e ABIS=arm64-v8a \
            openjtalk-android \
            bash -lc '
              set -e

              ./scripts/fetch_dependencies.sh
              ./scripts/build_dependencies_android.sh

              cmake -B build \
                -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-26 \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTS=OFF

              cmake --build build --parallel 2

              test -f build/lib/libopenjtalk_native.so

              cp build/lib/libopenjtalk_native.so \
                /output/libopenjtalk_native.so
            '

      - name: Generate checksum
        run: |
          test -f build/openjtalk/arm64-v8a/libopenjtalk_native.so

          sha256sum \
            build/openjtalk/arm64-v8a/libopenjtalk_native.so \
            > build/openjtalk/arm64-v8a/SHA256SUMS.txt

      - name: Upload OpenJTalk library
        uses: actions/upload-artifact@v4
        with:
          name: openjtalk-android-arm64
          path: build/openjtalk/arm64-v8a/
          if-no-files-found: error
