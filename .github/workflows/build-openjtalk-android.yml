
name: Build OpenJTalk Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4

      - name: Checkout OpenJTalk Native
        uses: actions/checkout@v4
        with:
          repository: ayutaz/openjtalk-native
          path: openjtalk-native

      - name: Download Japanese dictionary
        run: |
          set -e

          mkdir -p build/openjtalk/dictionary

          curl -L --fail --retry 3 \
            "https://sourceforge.net/projects/open-jtalk/files/Dictionary/open_jtalk_dic-1.11/open_jtalk_dic_utf_8-1.11.tar.gz/download" \
            -o build/openjtalk/dictionary.tar.gz

          echo "33e9cd251bc41aa2bd7ca36f57abbf61eae3543ca25ca892ae345e394cb10549  build/openjtalk/dictionary.tar.gz" \
            | sha256sum -c -

          tar -xzf build/openjtalk/dictionary.tar.gz \
            -C build/openjtalk/dictionary \
            --strip-components=1

          test -f build/openjtalk/dictionary/sys.dic
          test -f build/openjtalk/dictionary/matrix.bin
          test -f build/openjtalk/dictionary/char.bin
          test -f build/openjtalk/dictionary/unk.dic

          rm build/openjtalk/dictionary.tar.gz

      - name: Build Android Docker image
        run: |
          docker build \
            -f openjtalk-native/docker/Dockerfile.android \
            -t openjtalk-android \
            openjtalk-native

      - name: Compile OpenJTalk for arm64-v8a
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/openjtalk/arm64-v8a"

          docker run --rm \
            -v "$GITHUB_WORKSPACE/openjtalk-native:/workspace" \
            -v "$GITHUB_WORKSPACE/build/openjtalk/arm64-v8a:/output" \
            -w /workspace \
            -e ABIS=arm64-v8a \
            openjtalk-android \
            bash -lc '
              set -e

              ./scripts/fetch_dependencies.sh
              ./scripts/build_dependencies_android.sh

              cmake -B build \
                -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-26 \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTS=OFF

              cmake --build build --parallel 2

              test -f build/lib/libopenjtalk_native.so

              cp build/lib/libopenjtalk_native.so \
                /output/libopenjtalk_native.so
            '

      - name: Generate checksums
        run: |
          sha256sum \
            build/openjtalk/arm64-v8a/libopenjtalk_native.so \
            > build/openjtalk/arm64-v8a/SHA256SUMS.txt

      - name: Upload OpenJTalk library and dictionary
        uses: actions/upload-artifact@v4
        with:
          name: openjtalk-android-arm64
          path: build/openjtalk/
          if-no-files-found: error
